<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏀</text></svg>">
</head>
<body>
<!--ARTIFACT-START-->
<title>Coach's Playbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sticky header, court stage on the left with transport + step caption, control panel on the right (stacks under on phones). */
:root{
  --bg:#e7ebef; --panel:#ffffff; --panel2:#f2f5f7; --line:#d0d8df; --ink:#121a22; --muted:#56636f;
  --accent:#d9480f; --accent-ink:#ffffff; --accent-soft:#fbe3d6; --good:#1d7f55; --warn:#b42318;
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono","SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1318; --panel:#161d24; --panel2:#1d2630; --line:#2a3541; --ink:#e7ecf1; --muted:#8e9baa;
  --accent:#f76707; --accent-ink:#1a0c02; --accent-soft:#3a2010; --good:#4cc38a; --warn:#ff7b72; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1318; --panel:#161d24; --panel2:#1d2630; --line:#2a3541; --ink:#e7ecf1; --muted:#8e9baa;
  --accent:#f76707; --accent-ink:#1a0c02; --accent-soft:#3a2010; --good:#4cc38a; --warn:#ff7b72; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand svg{width:26px;height:26px;flex:none}
.brand b{font-family:var(--display);font-size:24px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.brand span{font-family:var(--display);font-size:24px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);line-height:1}
.spacer{flex:1}
@media (max-width:480px){.brand b,.brand span{font-size:20px}.brand{gap:7px}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel2);font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.icon{width:36px;padding:0}

#app{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:920px){#app{grid-template-columns:minmax(0,1fr)}}

#stage{display:flex;flex-direction:column;gap:10px;min-width:0}
.playhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
.playhead h1{margin:0;font-family:var(--display);font-weight:700;font-size:32px;line-height:1;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.playhead .meta{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.playhead p{margin:0;flex-basis:100%;color:var(--muted);max-width:70ch}

#courtWrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
#court{display:block;width:100%;height:auto;max-height:calc(100vh - 280px);min-height:260px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
body.editing #court{touch-action:none}
#caption{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line);min-height:58px}
#caption .step{flex:none;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;
  background:var(--ink);color:var(--panel);border-radius:6px;padding:3px 8px;line-height:1.2}
#caption .txt{font-size:17px;line-height:1.35;font-weight:500;min-width:0}

#transport{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#transport .grow{flex:1 1 160px;min-width:120px;display:flex;align-items:center;gap:10px}
#scrub{flex:1;accent-color:var(--accent);min-width:0}
#clock{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
#playBtn{width:46px}
select.sm{min-height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);padding:4px 8px;font-size:13px}

#frames{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fchip{min-width:34px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.fchip.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.fchip.add{font-family:var(--body);padding:0 10px;color:var(--accent);border-style:dashed}

aside{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:11px 6px;font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.pane{padding:14px;display:flex;flex-direction:column;gap:14px}
.sect{display:flex;flex-direction:column;gap:8px}
.sect h3{margin:0;font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row > .btn{flex:1 1 auto}

.plist{display:flex;flex-direction:column;gap:4px}
.pitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:8px 10px}
.pitem:hover{background:var(--panel2)}
.pitem.on{background:var(--accent-soft);border-color:var(--accent)}
.pitem .nm{flex:1;min-width:0;font-weight:600}
.pitem .sub{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted);flex:none}
.tag.mine{border-color:var(--good);color:var(--good)}

label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
label.f.inline{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px}
input[type=text],input[type=number],textarea,select.full{width:100%;min-height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:6px 9px;font-size:14px;color:var(--ink)}
textarea{resize:vertical;min-height:64px;line-height:1.4}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
input[type=color]{width:40px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:2px}

.prow{display:grid;grid-template-columns:30px minmax(0,1fr) 54px 36px;gap:6px;align-items:center}
.pos{font-family:var(--display);font-weight:700;font-size:15px;text-align:center;border-radius:50%;width:30px;height:30px;line-height:30px;color:#fff}
.ph{width:36px;height:34px;border-radius:8px;border:1px dashed var(--line);background:var(--panel2) center/cover no-repeat;padding:0;font-size:16px;color:var(--muted)}
.ph.set{border-style:solid;color:transparent}
.hint{font-size:12px;color:var(--muted);margin:0}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--panel2);padding:7px 6px;font-size:13px;font-weight:500}
.seg button + button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--panel)}

.editbar{display:flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);padding:10px 14px;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase}
.editbar .btn{color:var(--ink)}
.selbox{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--panel2)}
.confirm{font-size:12px;color:var(--warn)}

#modal{position:fixed;inset:0;z-index:20;background:rgba(8,12,16,.55);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(640px,100%);max-height:100%;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
#modal h2{margin:0;font-family:var(--display);font-size:24px;text-transform:uppercase;letter-spacing:.03em}
#modal textarea{min-height:240px;font-family:var(--mono);font-size:12px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:8px;font-weight:500;z-index:30;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.show{opacity:1}

/* court dots */
.pl .halo{fill:none;stroke:#ffb020;stroke-width:.09;opacity:0}
.pl.has .halo{opacity:1}
.pl.sel .halo{opacity:1;stroke:#22c3ee;stroke-dasharray:.18 .12}
.pl .body{stroke:#fff;stroke-width:.07}
.pl .lbl{font-family:var(--display);font-weight:700;font-size:.52px;fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:.05px}
.pl .lbl.small{font-size:.34px}
.pl .tagbg{fill:rgba(12,16,20,.82)}
.pl .tagtx{font-family:var(--body);font-weight:600;font-size:.3px;fill:#fff}
.pl.d .body{stroke-dasharray:none}
body.editing .pl.o, body.editing #ball{cursor:grab}
body.editing.manual .pl.d{cursor:grab}
.dragging{cursor:grabbing!important}

/* present mode */
body.present aside, body.present .playhead p, body.present #frames{display:none}
body.present #app{grid-template-columns:minmax(0,1fr)}
body.present #court{max-height:calc(100vh - 190px)}
body.present #caption .txt{font-size:22px}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
</style>

<header id="bar">
  <a class="brand" href="../" title="Basketball home">
    <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#e8590c" stroke="#5a2306" stroke-width="1.5"/><path d="M2 16h28M16 2v28M6 6c5 4 5 16 0 20M26 6c-5 4-5 16 0 20" fill="none" stroke="#5a2306" stroke-width="1.5"/></svg>
    <b>Basketball</b><span>Playbook</span>
  </a>
  <div class="spacer"></div>
  <button class="btn" id="presentBtn" title="Hide the panels and show the court big">Present</button>
</header>

<main id="app">
  <section id="stage">
    <div class="playhead">
      <h1 id="pTitle">Playbook</h1>
      <span class="meta" id="pMeta"></span>
      <p id="pDesc"></p>
    </div>
    <div id="courtWrap">
      <svg id="court" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Basketball court with players">
        <defs id="defs"></defs>
        <g id="gCourt"></g>
        <g id="gArrows"></g>
        <g id="gDef"></g>
        <g id="gOff"></g>
        <g id="gBall"></g>
      </svg>
      <div id="caption"><span class="step" id="capStep">Step 1</span><span class="txt" id="capTxt"></span></div>
    </div>
    <div id="transport">
      <button class="btn icon" id="restartBtn" title="Back to start" aria-label="Back to start"><svg viewBox="0 0 16 16"><path d="M3 2v12M13 2 5 8l8 6z" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></button>
      <button class="btn icon" id="prevBtn" title="Previous step (←)" aria-label="Previous step"><svg viewBox="0 0 16 16"><path d="M11 2 4 8l7 6z" fill="currentColor"/></svg></button>
      <button class="btn primary" id="playBtn" title="Play / pause (space)" aria-label="Play"><svg viewBox="0 0 16 16" id="playIco"><path d="M4 2l10 6-10 6z" fill="currentColor"/></svg></button>
      <button class="btn icon" id="nextBtn" title="Next step (→)" aria-label="Next step"><svg viewBox="0 0 16 16"><path d="M5 2l7 6-7 6z" fill="currentColor"/></svg></button>
      <div class="grow"><input type="range" id="scrub" min="0" max="1000" value="0" step="1" aria-label="Timeline"><span id="clock">0.0 / 0.0s</span></div>
      <select class="sm" id="speedSel" aria-label="Speed"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1">1×</option><option value="1.5">1.5×</option></select>
      <button class="btn" id="loopBtn" title="Repeat the play">Loop</button>
    </div>
    <div id="frames"></div>
  </section>

  <aside id="side">
    <div id="editHead" hidden>
      <div class="editbar"><span style="flex:1">Editing</span><button class="btn" id="doneBtn">Done</button></div>
    </div>
    <div class="tabs" id="tabs">
      <button data-tab="plays" class="on">Plays</button>
      <button data-tab="team">Team</button>
      <button data-tab="display">Display</button>
    </div>
    <div class="pane" id="pane-plays"></div>
    <div class="pane" id="pane-team" hidden></div>
    <div class="pane" id="pane-display" hidden></div>
    <div class="pane" id="pane-edit" hidden></div>
  </aside>
</main>

<div id="modal" hidden><div class="box" id="modalBox"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" accept="image/*" hidden>
<input type="file" id="jsonIn" accept=".json,application/json" hidden>

<script src="plays.js"></script>
<script>
(function(){
'use strict';
const PB = window.PLAYBOOK || {spots:{}, defenses:{}, plays:[]};
const NS = 'http://www.w3.org/2000/svg';
const RIM = [1.575, 7.5];
const KS = ['1','2','3','4','5'];
const POSN = {1:'PG',2:'SG',3:'SF',4:'PF',5:'C'};
const CATS = ['Offense','Defense','Inbounds','Press break','Drills'];
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
const lerp2 = (p,q,t) => [lerp(p[0],q[0],t), lerp(p[1],q[1],t)];
const dist = (p,q) => Math.hypot(p[0]-q[0], p[1]-q[1]);
const ease = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;
const clone = o => JSON.parse(JSON.stringify(o));
const r1 = v => Math.round(v*10)/10;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function el(tag, attrs, parent){ const e = document.createElementNS(NS, tag); if(attrs) for(const k in attrs) e.setAttribute(k, attrs[k]); if(parent) parent.appendChild(e); return e; }
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};

/* ---------------- state ---------------- */
function blankTeam(name, color){ const p = {}; KS.forEach(k => p[k] = {name:'', num:'', photo:''}); return {name, color, players:p}; }
let teams = store.get('bb.teams', null) || {off: blankTeam('Offense', '#e8590c'), def: blankTeam('Defense', '#1f5fa8')};
let opts = Object.assign({view:'half', court:'wood', label:'num', names:true, arrows:true, def:'play', speed:1, loop:false}, store.get('bb.opts', {}));
let myPlays = store.get('bb.plays', []);
let play = null, F = [], TL = {segs:[], total:1}, t = 0, playing = false;
let editing = false, selected = null, dispD = null, lastKey = '', confirmDel = false;
const saveOpts = () => store.set('bb.opts', opts);
const saveTeams = () => { if(!store.set('bb.teams', teams)) toast('Could not save on this device (storage full or blocked)'); };
const saveMine = () => { if(!store.set('bb.plays', myPlays)) toast('Could not save on this device (storage full or blocked)'); };
const allPlays = () => PB.plays.map(p => Object.assign({builtin:true}, p)).concat(myPlays);

/* ---------------- play resolution ---------------- */
const START = {1:'top', 2:'lwing', 3:'rwing', 4:'lcorner', 5:'rcorner'};
function spot(v){
  if(Array.isArray(v) && v.length === 2) return [+v[0], +v[1]];
  if(typeof v === 'string' && PB.spots[v]) return PB.spots[v].slice();
  return null;
}
function resolve(p){
  const out = []; let o = {}, d = null, ball = '1';
  KS.forEach(k => o[k] = spot(START[k]));
  (p.frames || []).forEach((f, i) => {
    o = Object.assign({}, o);
    if(f.o) for(const k in f.o){ const q = spot(f.o[k]); if(q) o[String(k)] = q; }
    if(f.d){ d = Object.assign({}, d || {}); for(const k in f.d){ const q = spot(f.d[k]); if(q) d[String(k)] = q; } }
    if(f.ball != null && f.ball !== '') ball = String(f.ball);
    out.push({ o, d: d ? Object.assign({}, d) : null, ball, note: f.note || '',
      dur: f.dur != null ? +f.dur : 1.2, hold: f.hold != null ? +f.hold : (i === 0 ? 0.8 : 0.5),
      screens: new Set((f.screens || []).map(String)), passAt: clamp(+f.passAt || 0, 0, 0.9) });
  });
  return out;
}
function buildTimeline(){
  const segs = []; let tt = 0;
  F.forEach((f, i) => {
    if(i > 0){ const d = Math.max(.15, f.dur); segs.push({type:'move', i, start:tt, end:tt+d}); tt += d; }
    const h = i === F.length-1 ? Math.max(f.hold, 1.2) : Math.max(0.05, f.hold);
    segs.push({type:'hold', i, start:tt, end:tt+h}); tt += h;
  });
  TL = {segs, total: Math.max(tt, .1)};
}
const frameStart = i => { const s = TL.segs.find(s => s.type === 'hold' && s.i === i); return s ? s.start : 0; };
function rebuild(keepFrame){
  const fi = keepFrame != null ? keepFrame : null;
  F = resolve(play); buildTimeline();
  if(fi != null) t = frameStart(clamp(fi, 0, F.length-1));
  t = clamp(t, 0, TL.total - 1e-6);
  lastKey = '';
}

function sample(tt){
  const seg = TL.segs.find(s => tt < s.end) || TL.segs[TL.segs.length-1];
  const ballAt = (fr, o, h) => h === 'rim' ? RIM : (o[h] || RIM);
  if(seg.type === 'hold'){
    const f = F[seg.i];
    return {i:seg.i, moving:false, o:f.o, d:f.d, holder:f.ball, ball:ballAt(f, f.o, f.ball), lift:0};
  }
  const a = F[seg.i-1], b = F[seg.i];
  const raw = clamp((tt - seg.start) / (seg.end - seg.start), 0, 1), p = ease(raw);
  const o = {}; KS.forEach(k => o[k] = lerp2(a.o[k], b.o[k], p));
  let d = null; if(a.d && b.d){ d = {}; KS.forEach(k => d[k] = lerp2(a.d[k] || b.d[k], b.d[k] || a.d[k], p)); } else if(b.d) d = b.d;
  let holder, ball, lift = 0;
  if(a.ball === b.ball){ holder = a.ball; ball = ballAt(b, o, holder); }
  else {
    const pb = clamp((raw - b.passAt) / (1 - b.passAt), 0, 1);
    const from = ballAt(a, o, a.ball), to = ballAt(b, o, b.ball);
    if(pb <= 0){ holder = a.ball; ball = from; }
    else if(pb >= 1){ holder = b.ball; ball = to; }
    else { holder = null; ball = lerp2(from, to, ease(pb)); lift = Math.sin(Math.PI * pb) * (b.ball === 'rim' ? 1 : .45); }
  }
  return {i:seg.i, moving:true, o, d, holder, ball, lift};
}

/* ---------------- defense logic ---------------- */
const unit = (p, q) => { const dx = q[0]-p[0], dy = q[1]-p[1], L = Math.hypot(dx, dy) || 1; return [dx/L, dy/L]; };
function manTargets(o, Q, holder){
  const T = {};
  KS.forEach(k => {
    const P = o[k];

  const P = teams[key].players[k];
  modal(`<h2>Photo for ${esc(P.name || (key === 'off' ? 'player ' : 'defender ') + k)}</h2>
    <div class="row"><img src="${P.photo}" alt="" style="width:96px;height:96px;border-radius:50%;object-fit:cover"></div>
    <div class="row"><button class="btn primary" id="phReplace">Choose a new photo</button><button class="btn danger" id="phRemove">Remove photo</button><button class="btn" data-close>Cancel</button></div>`);
  $('#phReplace').onclick = () => { closeModal(); photoTarget = [key, k]; $('#fileIn').value = ''; $('#fileIn').click(); };
  $('#phRemove').onclick = () => { P.photo = ''; saveTeams(); applyTeams(); renderTeam(); closeModal(); };
}
$('#fileIn').addEventListener('change', e => {
  const f = e.target.files[0]; if(!f || !photoTarget) return;
  const [key, k] = photoTarget, rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = 160;
      const s = Math.min(img.width, img.height), sy = img.height > img.width ? (img.height - s) * .25 : (img.height - s)/2;
      c.getContext('2d').drawImage(img, (img.width - s)/2, sy, s, s, 0, 0, 160, 160);
      teams[key].players[k].photo = c.toDataURL('image/jpeg', .82);
      if(opts.label !== 'photo'){ opts.label = 'photo'; saveOpts(); }
      saveTeams(); applyTeams(); renderTeam(); toast('Photo added');
    };
    img.onerror = () => toast('That file could not be read as an image');
    img.src = rd.result;
  };
  rd.readAsDataURL(f);
});

/* ---------------- UI: display ---------------- */
function renderDisplay(){
  const seg = (id, cur, items) => `<div class="seg" id="${id}">${items.map(([v,l]) => `<button data-v="${v}" class="${cur === v ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  $('#pane-display').innerHTML = `
    <div class="sect"><h3>Court</h3>${seg('viewSeg', opts.view, [['half','Half court'],['full','Full court']])}
      ${seg('courtSeg', opts.court, [['wood','Hardwood'],['board','Whiteboard']])}</div>
    <div class="sect"><h3>Defense</h3>
      <select class="full" id="defSel">
        <option value="play">Use the play's defense</option>
        ${Object.keys(PB.defenses).map(id => `<option value="${id}">${esc(PB.defenses[id].name)}</option>`).join('')}
        <option value="none">Hide defense</option>
      </select>
      <p class="hint">Defenders move on their own based on where the ball is. Switch defense to see how the same play looks against man or zone.</p></div>
    <div class="sect"><h3>Diagram</h3>
      <label class="f inline"><input type="checkbox" id="arrowChk" ${opts.arrows ? 'checked' : ''}> Show movement lines</label>
      <p class="hint">Solid arrow = cut. Zigzag = dribble. Dashed = pass or shot. Line ending in a bar = screen.</p></div>`;
  $('#defSel').value = opts.def;
}
$('#pane-display').addEventListener('click', e => {
  const b = e.target.closest('button[data-v]'); if(!b) return;
  const g = b.parentElement.id;
  if(g === 'viewSeg') opts.view = b.dataset.v;
  if(g === 'courtSeg') opts.court = b.dataset.v;
  saveOpts(); drawCourt(); dispD = null; renderDisplay();
});
$('#pane-display').addEventListener('change', e => {
  if(e.target.id === 'defSel'){ opts.def = e.target.value; dispD = null; saveOpts(); }
  if(e.target.id === 'arrowChk'){ opts.arrows = e.target.checked; saveOpts(); lastKey = ''; }
});

/* tabs */
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  ['plays','team','display'].forEach(n => $('#pane-' + n).hidden = n !== b.dataset.tab);
});

/* ---------------- editing ---------------- */
function startEdit(){
  if(!play) return;
  const fi = curFrame();
  if(play.builtin){
    const c = clone(play); delete c.builtin; delete c.sample; c.id = newId(); c.name = play.name + ' (my copy)';
    myPlays.push(c); saveMine(); selectPlay(c.id); toast('Made your own copy to edit');
  }
  editing = true; selected = null; setPlaying(false); gotoFrame(fi);
  document.body.classList.add('editing');
  $('#editHead').hidden = false; $('#tabs').hidden = true;
  ['plays','team','display'].forEach(n => $('#pane-' + n).hidden = true);
  $('#pane-edit').hidden = false;
  renderEdit(); renderFrames();
}
function stopEdit(){
  editing = false; selected = null; confirmDel = false;
  document.body.classList.remove('editing');
  $('#editHead').hidden = true; $('#tabs').hidden = false; $('#pane-edit').hidden = true;
  const on = document.querySelector('#tabs button.on').dataset.tab;
  ['plays','team','display'].forEach(n => $('#pane-' + n).hidden = n !== on);
  renderFrames(); renderPlays(); refreshHead();
}
$('#doneBtn').onclick = stopEdit;
let saveTimer = null;
function changed(fi){ rebuild(fi); clearTimeout(saveTimer); saveTimer = setTimeout(saveMine, 250); }
function renderEdit(){
  $('#pane-edit').innerHTML = `
    <div class="sect"><h3>Play</h3>
      <label class="f">Name<input type="text" id="ePName" value="${esc(play.name)}"></label>
      <div class="row">
        <label class="f" style="flex:1">Type<select class="full" id="ePCat">${CATS.map(c => `<option${c === play.category ? ' selected' : ''}>${c}</option>`).join('')}</select></label>
        <label class="f" style="flex:1">Defense<select class="full" id="ePDef">${Object.keys(PB.defenses).map(id => `<option value="${id}"${(play.defense||'man') === id ? ' selected' : ''}>${esc(PB.defenses[id].name)}</option>`).join('')}<option value="manual"${play.defense === 'manual' ? ' selected' : ''}>Manual (drag defenders)</option><option value="none"${play.defense === 'none' ? ' selected' : ''}>No defense</option></select></label>
      </div>
      <label class="f">What the play is for<textarea id="ePDesc" rows="2">${esc(play.description || '')}</textarea></label>
    </div>
    <div class="sect" id="eFrame"></div>
    <div class="sect"><h3>Play actions</h3>
      <div class="row"><button class="btn" id="eExport">Export this play</button><button class="btn danger" id="eDelete">Delete play</button></div>
      <span class="confirm" id="eConfirm" hidden>Tap Delete again to remove this play for good.</span>
    </div>`;
  renderEditFrame(curFrame());
}
function renderEditFrame(i){
  const box = $('#eFrame'); if(!box) return;
  const f = play.frames[i], R = F[i];
  const sel = selected ? `<div class="selbox"><strong>Player ${selected} (${POSN[selected]})${teams.off.players[selected].name ? ' · ' + esc(teams.off.players[selected].name) : ''}</strong>
      <div class="row"><button class="btn" id="eGive" ${R.ball === selected ? 'disabled' : ''}>Give ball</button>
      <button class="btn${R.screens.has(selected) ? ' on' : ''}" id="eScreen">Sets a screen</button>
      <button class="btn" id="eReset" ${i === 0 || !(f.o && f.o[selected]) ? 'disabled' : ''}>Undo move</button></div></div>`
    : '<p class="hint">Drag players to where they go in this step. Drag the ball onto a player to pass, or onto the rim to shoot. Tap a player for more options.</p>';
  box.innerHTML = `<h3>Step ${i+1} of ${F.length}</h3>
    <label class="f">What happens (shown to the kids)<textarea id="eNote" rows="3">${esc(f.note || '')}</textarea></label>
    <div class="row">
      <label class="f" style="flex:1">Move time (s)<input type="number" id="eDur" min="0.2" max="6" step="0.1" value="${R.dur}" ${i === 0 ? 'disabled' : ''}></label>
      <label class="f" style="flex:1">Pause (s)<input type="number" id="eHold" min="0" max="10" step="0.1" value="${R.hold}"></label>
    </div>
    ${sel}
    <div class="row"><button class="btn" id="eAdd">Add step after</button><button class="btn" id="eShot" ${R.ball === 'rim' ? 'disabled' : ''}>Shoot</button><button class="btn danger" id="eDelFrame" ${F.length < 2 ? 'disabled' : ''}>Delete step</button></div>`;
}
$('#pane-edit').addEventListener('input', e => {
  const x = e.target, i = curFrame(), f = play.frames[i];
  if(x.id === 'ePName'){ play.name = x.value; refreshHead(); }
  else if(x.id === 'ePDesc'){ play.description = x.value; refreshHead(); }
  else if(x.id === 'eNote'){ f.note = x.value; $('#capTxt').textContent = x.value; F[i].note = x.value; clearTimeout(saveTimer); saveTimer = setTimeout(saveMine, 300); return; }
  else if(x.id === 'eDur'){ const v = parseFloat(x.value); if(v > 0){ f.dur = v; changed(i); } return; }
  else if(x.id === 'eHold'){ const v = parseFloat(x.value); if(v >= 0){ f.hold = v; changed(i); } return; }
  else return;
  clearTimeout(saveTimer); saveTimer = setTimeout(saveMine, 300);
});
$('#pane-edit').addEventListener('change', e => {
  const x = e.target, i = curFrame();
  if(x.id === 'ePCat'){ play.category = x.value; refreshHead(); saveMine(); }
  if(x.id === 'ePDef'){
    if(x.value === 'manual' && !play.frames.some(f => f.d)) seedManual();
    play.defense = x.value; dispD = null; changed(i); refreshHead();
  }
});
function seedManual(){
  const sid = schemeId() === 'manual' ? 'man' : (schemeId() || 'man');
  F.forEach((R, i) => {
    const T = targets(sid, R.o, R.ball === 'rim' ? RIM : R.o[R.ball], R.ball, null);
    const d = {}; KS.forEach(k => d[k] = [r1(T[k][0]), r1(T[k][1])]);
    play.frames[i].d = d;
  });
}
$('#pane-edit').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  const i = curFrame(), f = play.frames[i];
  switch(b.id){
    case 'eAdd': return addFrame();
    case 'eShot': f.ball = 'rim'; if(!f.passAt && f.o && f.o[F[i-1] ? F[i-1].ball : '']) f.passAt = .5; changed(i); renderEditFrame(i); return;
    case 'eDelFrame':
      if(play.frames.length < 2) return;
      if(i === 0){ // fold step 1's spots into step 2 so the start stays sensible
        const n = play.frames[1]; n.o = Object.assign({}, F[1].o); n.ball = F[1].ball; if(F[1].d) n.d = Object.assign({}, F[1].d);
      }
      play.frames.splice(i, 1); changed(Math.min(i, play.frames.length - 1)); renderFrames(); renderEditFrame(curFrame()); return;
    case 'eGive': f.ball = +selected; changed(i); renderEditFrame(i); return;
    case 'eScreen': { const s = new Set((f.screens || []).map(String)); s.has(selected) ? s.delete(selected) : s.add(selected); f.screens = [...s].map(Number); changed(i); renderEditFrame(i); return; }
    case 'eReset': if(f.o){ delete f.o[selected]; } changed(i); renderEditFrame(i); return;
    case 'eExport': return openExport(play);
    case 'eDelete':
      if(!confirmDel){ confirmDel = true; $('#eConfirm').hidden = false; b.textContent = 'Delete for good'; return; }
      myPlays = myPlays.filter(p => p.id !== play.id); saveMine(); confirmDel = false; stopEdit(); selectPlay(allPlays()[0].id); toast('Play deleted'); return;
  }
});
function addFrame(){
  const i = curFrame();
  play.frames.splice(i + 1, 0, {note:'', dur:1.2});
  changed(i + 1); renderFrames(); renderEditFrame(i + 1); selected = null;
  const n = $('#eNote'); if(n) n.focus();
}

/* drag & drop on the court */
let drag = null;
function svgPt(e){ const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const r = pt.matrixTransform(svg.getScreenCTM().inverse()); return [r.x, r.y]; }
function courtPt(e){ const c = fromS(svgPt(e)); return [clamp(c[0], -0.5, opts.view === 'half' ? 14.2 : 28.4), clamp(c[1], -0.5, 15.5)]; }
svg.addEventListener('pointerdown', e => {
  if(!editing) return;
  const g = e.target.closest('.pl, #ball'); if(!g) return;
  let kind = g.id === 'ball' ? 'ball' : g.dataset.side;
  if(kind === 'd' && schemeId() !== 'manual'){ toast('Defenders move on their own. Pick "Manual" defense to drag them.'); return; }
  e.preventDefault(); svg.setPointerCapture(e.pointerId);
  drag = {kind, k: g.dataset.k, start: [e.clientX, e.clientY], moved: false, i: curFrame()};
  document.body.classList.add('dragging');
});
svg.addEventListener('pointermove', e => {
  if(!drag) return;
  if(!drag.moved && Math.hypot(e.clientX - drag.start[0], e.clientY - drag.start[1]) < 5) return;
  drag.moved = true;
  const p = courtPt(e), f = play.frames[drag.i];
  if(drag.kind === 'o'){ f.o = f.o || {}; f.o[drag.k] = [r1(p[0]), r1(p[1])]; rebuild(drag.i); }
  else if(drag.kind === 'd'){ f.d = f.d || {}; f.d[drag.k] = [r1(p[0]), r1(p[1])]; rebuild(drag.i); dispD = null; }
  else if(drag.kind === 'ball'){ const s = toS(p); ballBody.setAttribute('transform', `translate(${s[0]} ${s[1]}) scale(1.15)`); drag.p = p; }
});
function endDrag(e){
  if(!drag) return;
  const d = drag; drag = null; document.body.classList.remove('dragging');
  const f = play.frames[d.i];
  if(d.kind === 'ball' && d.moved && d.p){
    let best = null, bd = 1.3; KS.forEach(k => { const dd = dist(F[d.i].o[k], d.p); if(dd < bd){ bd = dd; best = k; } });
    if(dist(d.p, RIM) < 1.1) best = 'rim';
    if(best){ f.ball = best === 'rim' ? 'rim' : +best; toast(best === 'rim' ? 'Shot' : 'Ball to ' + best); }
    else toast('Drop the ball on a player or the rim');
  }
  if(!d.moved && d.kind === 'o'){ selected = selected === d.k ? null : d.k; }
  if(d.kind === 'ball' && !d.moved) toast('Drag the ball onto a player or the rim');
  changed(d.i); renderEditFrame(d.i);
}
svg.addEventListener('pointerup', endDrag);
svg.addEventListener('pointercancel', endDrag);

/* ---------------- transport ---------------- */
$('#playBtn').onclick = () => { if(!playing && t >= TL.total - .01) t = 0; if(!playing) dispD = dispD; setPlaying(!playing); };
$('#restartBtn').onclick = () => gotoFrame(0);
$('#prevBtn').onclick = () => { const s = sample(t); gotoFrame(s.moving ? s.i - 1 : s.i - 1); };
$('#nextBtn').onclick = () => gotoFrame(curFrame() + 1);
const scrub = $('#scrub');
scrub.addEventListener('input', () => { scrubbing = true; setPlaying(false); t = scrub.value / 1000 * TL.total; t = clamp(t, 0, TL.total - 1e-6); });
scrub.addEventListener('change', () => { scrubbing = false; });
$('#speedSel').value = String(opts.speed);
$('#speedSel').onchange = e => { opts.speed = +e.target.value; saveOpts(); };
const loopBtn = $('#loopBtn');
const syncLoop = () => loopBtn.classList.toggle('on', !!opts.loop);
loopBtn.onclick = () => { opts.loop = !opts.loop; saveOpts(); syncLoop(); };
syncLoop();
$('#presentBtn').onclick = () => {
  const on = document.body.classList.toggle('present');
  $('#presentBtn').textContent = on ? 'Exit present' : 'Present';
  $('#presentBtn').classList.toggle('on', on);
  try{
    if(on && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
    if(!on && document.fullscreenElement) document.exitFullscreen().catch(() => {});
  }catch(err){}
};
document.addEventListener('keydown', e => {
  if(e.target.closest('input, textarea, select')) return;
  if(e.code === 'Space'){ e.preventDefault(); $('#playBtn').click(); }
  else if(e.key === 'ArrowRight'){ e.preventDefault(); $('#nextBtn').click(); }
  else if(e.key === 'ArrowLeft'){ e.preventDefault(); $('#prevBtn').click(); }
  else if(e.key === 'Escape' && !$('#modal').hidden) closeModal();
});

/* ---------------- modal, toast, import/export ---------------- */
function modal(html){ $('#modalBox').innerHTML = html; $('#modal').hidden = false; }
function closeModal(){ $('#modal').hidden = true; $('#modalBox').innerHTML = ''; }
$('#modal').addEventListener('click', e => { if(e.target.id === 'modal' || e.target.closest('[data-close]')) closeModal(); });
let toastT = null;
function toast(msg){ const x = $('#toast'); x.textContent = msg; x.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => x.classList.remove('show'), 2200); }
function cleanPlay(p){ const c = clone(p); delete c.builtin; return c; }
function openExport(one){
  const data = one ? cleanPlay(one) : {app:'basketball-playbook', version:1, plays: myPlays.map(cleanPlay), teams};
  const txt = JSON.stringify(data, null, one ? 2 : 0);
  modal(`<h2>${one ? 'Export play' : 'Back up everything'}</h2>
    <p class="hint">${one ? 'Copy this and paste it into Import on another device, or send it to someone.' : 'Includes your plays, team names and photos.'}</p>
    <textarea id="exTxt" readonly spellcheck="false">${esc(txt)}</textarea>
    <div class="row"><button class="btn primary" id="exCopy">Copy</button><button class="btn" id="exDl">Download file</button><button class="btn" data-close>Close</button></div>`);
  $('#exCopy').onclick = () => {
    const ta = $('#exTxt');
    const fallback = () => { ta.focus(); ta.select(); toast('Selected. Press Ctrl+C / ⌘C to copy'); };
    try{ navigator.clipboard.writeText(txt).then(() => toast('Copied'), fallback); }catch(err){ fallback(); }
  };
  $('#exDl').onclick = () => {
    try{
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([txt], {type:'application/json'}));
      a.download = (one ? (one.name || 'play').replace(/[^\w-]+/g, '-').toLowerCase() : 'playbook-backup') + '.json';
      document.body.appendChild(a); a.click(); a.remove();
    }catch(err){ toast('Download is blocked here. Use Copy instead.'); }
  };
}
function openImport(){
  modal(`<h2>Import</h2>
    <p class="hint">Paste a play or a backup, or choose a .json file.</p>
    <textarea id="imTxt" spellcheck="false" placeholder='{"name": "...", "frames": [...]}'></textarea>
    <div class="row"><button class="btn primary" id="imGo">Import</button><button class="btn" id="imFile">Choose file</button><button class="btn" data-close>Cancel</button></div>`);
  $('#imGo').onclick = () => doImport($('#imTxt').value);
  $('#imFile').onclick = () => { $('#jsonIn').value = ''; $('#jsonIn').click(); };
}
$('#jsonIn').addEventListener('change', e => { const f = e.target.files[0]; if(!f) return; f.text().then(doImport); });
function doImport(txt){
  let data; try{ data = JSON.parse(txt); }catch(err){ toast('That is not valid play data. Check it was copied in full.'); return; }
  let plays = [];
  if(Array.isArray(data)) plays = data;
  else if(data && data.frames) plays = [data];
  else if(data && Array.isArray(data.plays)) plays = data.plays;
  if(data && data.teams && data.teams.off && data.teams.def){ teams = data.teams; saveTeams(); applyTeams(); renderTeam(); }
  let n = 0, last = null;
  plays.forEach(p => {
    if(!p || !Array.isArray(p.frames) || !p.frames.length) return;
    const c = cleanPlay(p); delete c.sample;
    const ex = myPlays.findIndex(m => m.id === c.id);
    if(!c.id || PB.plays.some(b => b.id === c.id)) c.id = newId();
    if(ex >= 0) myPlays[ex] = c; else myPlays.push(c);
    n++; last = c.id;
  });
  saveMine(); closeModal(); renderPlays();
  if(last) selectPlay(last);
  toast(n ? `Imported ${n} play${n > 1 ? 's' : ''}` : (data && data.teams ? 'Team imported' : 'No plays found in that data'));
}

/* ---------------- boot ---------------- */
drawCourt(); applyTeams(); renderTeam(); renderDisplay();
const sel = store.get('bb.sel', null);
selectPlay(allPlays().some(p => p.id === sel) ? sel : (allPlays()[0] || {}).id);
requestAnimationFrame(tick);
})();
</script>
